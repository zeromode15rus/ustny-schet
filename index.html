<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Устный счёт</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#1b1d21; --muted:#6b7280; --line:#e2e5ea;
  --accent:#2f6fec; --accent-ink:#ffffff; --accent-soft:#e8effd;
  --ok:#15803d; --ok-bg:#e6f6ec; --bad:#dc2626; --bad-bg:#fdecec; --chip:#eef1f5;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111317; --card:#1a1d22; --text:#e8ebf0; --muted:#9aa3af; --line:#2b3037;
    --accent:#6b97ff; --accent-ink:#0b1020; --accent-soft:#1f2a44;
    --ok:#3ccf7d; --ok-bg:#13301f; --bad:#ff6b6b; --bad-bg:#3a1919; --chip:#242930;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:1.6rem;margin:8px 0 16px;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.label{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.label:first-child{margin-top:0}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;background:var(--chip);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;padding:9px 4px;border-radius:9px;font-size:.95rem;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
#seg-mode{grid-template-columns:repeat(2,1fr)}
@media (min-width:480px){#seg-mode{grid-template-columns:repeat(4,1fr)}}
.desc{font-size:.9rem;color:var(--muted);margin-top:8px;min-height:1.3em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.9rem}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.link{border:0;background:none;color:var(--accent);padding:8px 0 0;font-size:.92rem;text-decoration:underline;text-underline-offset:3px}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 18px;font-weight:600}
.primary:active{filter:brightness(.92)}
.secondary{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 18px;font-weight:600}
.secondary:disabled{opacity:.45;cursor:default}
.ghost{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 16px;font-size:.92rem;color:var(--muted)}
.big{width:100%;margin-top:18px;padding:14px;font-size:1.05rem}
.note{color:var(--muted);font-size:.85rem;text-align:center}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:.92rem}

/* лучшие и история */
table.best{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
table.best th,table.best td{padding:6px 2px;text-align:center;border-bottom:1px solid var(--line)}
table.best th:first-child,table.best td:first-child{text-align:left}
table.best td small{display:block;color:var(--muted);font-size:.75rem}
table.best tr:last-child td{border-bottom:0}
.fbest{margin-top:10px;font-size:.9rem}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.hist li:last-child{border-bottom:0}
.hist .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.hist .when{color:var(--muted);font-size:.8rem}

/* тренировка */
.bar{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums;font-weight:600}
.bar #q-timer{margin-left:auto;color:var(--muted)}
.icon{border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;line-height:34px;padding:0}
.progress{height:4px;background:var(--chip);border-radius:4px;margin:12px 0 0;overflow:hidden}
.progress>div{height:100%;width:0;background:var(--accent);transition:width .25s}
.stage{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:min(12vh,90px)}
.problem{font-size:clamp(2.2rem,11vw,3.6rem);font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.2;margin-bottom:22px;transition:color .15s;max-width:100%}
.problem.md{font-size:clamp(1.8rem,8.4vw,3rem)}
.problem.sm{font-size:clamp(1.35rem,5.6vw,2.3rem)}
.problem.f{font-size:clamp(1.5rem,6.6vw,2.2rem);font-weight:500;font-variant-numeric:normal}
.problem.ok{color:var(--ok)} .problem.bad{color:var(--bad)}
form#q-form{display:flex;gap:8px;width:100%;max-width:360px}
#q-input{flex:1;min-width:0;font-size:1.6rem;text-align:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);outline:none;font-variant-numeric:tabular-nums}
#q-input:focus{border-color:var(--accent)}
#q-input.ok{border-color:var(--ok);background:var(--ok-bg)}
#q-input.bad{border-color:var(--bad);background:var(--bad-bg)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:2em;margin:14px 0 6px;font-size:1.1rem;font-weight:600}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px;width:100%;max-width:440px}
.opts button{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-size:1.12rem;min-height:54px}
.opts button .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--chip);color:var(--muted);font-size:.8rem;display:grid;place-items:center}
.opts button.ok{border-color:var(--ok);background:var(--ok-bg)}
.opts button.bad{border-color:var(--bad);background:var(--bad-bg)}
.hint{margin-top:12px;background:var(--accent-soft);border-radius:12px;padding:12px 14px;text-align:left;font-size:.98rem;max-width:440px;width:100%}
.hint b{color:var(--accent)}

/* итог */
.center{text-align:center}
.score{font-size:3.4rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stats div{background:var(--chip);border-radius:12px;padding:10px}
.stats span{display:block;font-size:.8rem;color:var(--muted)}
.stats b{font-size:1.2rem;font-variant-numeric:tabular-nums}
.errs{list-style:none;margin:0;padding:0}
.errs li{padding:9px 0;border-bottom:1px solid var(--line);font-size:1.02rem}
.errs li:last-child{border-bottom:0}
.errs .yours{font-size:.85rem;color:var(--bad)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .ghost{grid-column:1/-1;justify-self:center;margin-top:4px}

/* шпаргалка */
.sheet-row{padding:7px 0;border-bottom:1px solid var(--line)}
.sheet-row:last-child{border-bottom:0}
table.trig{width:100%;border-collapse:collapse;font-size:.95rem;text-align:center}
table.trig th,table.trig td{border-bottom:1px solid var(--line);padding:5px 2px}
.sheet-sub{margin:14px 0 4px;font-weight:600;font-size:.95rem}

/* формулы */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.15;margin:0 .08em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .18em .05em}
.fr>span:last-child{padding:.05em .18em 0}
.rt{border-top:1px solid currentColor;padding-top:.04em}
.ab{border-left:1px solid currentColor;border-right:1px solid currentColor;padding:0 .12em;margin:0 .1em}
.cond,.rad{font-size:.62em;color:var(--muted);white-space:nowrap}
sup,sub{font-size:.68em;line-height:0}
</style>
</head>
<body>
<main>

<!-- ===== Старт ===== -->
<section id="scr-start" class="screen">
  <h1>Устный счёт</h1>
  <div class="card">
    <div class="label">Режим</div>
    <div class="seg" id="seg-mode">
      <button data-v="add">Сложение</button>
      <button data-v="mul">Умножение</button>
      <button data-v="mix">Смешанный</button>
      <button data-v="f">Формулы</button>
    </div>
    <div id="lvl-block">
      <div class="label">Уровень</div>
      <div class="seg" id="seg-level">
        <button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button>
      </div>
      <div class="desc" id="lvl-desc"></div>
    </div>
    <div id="cat-block" hidden>
      <div class="label">Темы</div>
      <div class="chips" id="cats"></div>
      <button class="link" id="btn-sheet" type="button">Шпаргалка по выбранным темам</button>
    </div>
    <div class="label">Примеров</div>
    <div class="seg" id="seg-n"><button data-v="10">10</button><button data-v="20">20</button></div>
    <button class="primary big" id="btn-go" type="button">Начать</button>
  </div>
  <div class="card"><h2>Лучшие результаты</h2><div id="best"></div></div>
  <div class="card"><h2>Последние тренировки</h2><div id="hist"></div></div>
  <p class="note" id="store-note" hidden>Хранилище браузера недоступно — история не сохранится после закрытия страницы.</p>
</section>

<!-- ===== Тренировка ===== -->
<section id="scr-quiz" class="screen" hidden>
  <div class="bar">
    <span id="q-count">1 / 10</span>
    <span id="q-timer">0:00</span>
    <button id="btn-exit" class="icon" type="button" aria-label="Выйти">✕</button>
  </div>
  <div class="progress"><div id="q-prog"></div></div>
  <div class="stage">
    <div id="q-text" class="problem"></div>
    <form id="q-form" autocomplete="off">
      <input id="q-input" type="text" inputmode="numeric" pattern="[0-9 ]*" enterkeyhint="done" autocomplete="off" aria-label="Ответ">
      <button class="primary" type="submit">Проверить</button>
    </form>
    <div id="q-opts" class="opts" hidden></div>
    <div id="q-fb" class="fb" aria-live="polite"></div>
    <button id="btn-hint" class="ghost" type="button">Приём</button>
    <div id="q-hint" class="hint" hidden></div>
  </div>
</section>

<!-- ===== Итог ===== -->
<section id="scr-result" class="screen" hidden>
  <h1>Итог</h1>
  <div class="card center">
    <div id="r-score" class="score"></div>
    <div id="r-sub" class="muted"></div>
    <div class="stats">
      <div><span>Общее время</span><b id="r-time"></b></div>
      <div><span>В среднем на пример</span><b id="r-avg"></b></div>
    </div>
  </div>
  <div class="card" id="r-err-card"><h2>Ошибки</h2><ul class="errs" id="r-err"></ul></div>
  <div class="actions">
    <button class="primary" id="btn-again" type="button">Ещё раз</button>
    <button class="secondary" id="btn-errs" type="button">Только ошибки</button>
    <button class="ghost" id="btn-menu" type="button">В меню</button>
  </div>
</section>

<!-- ===== Шпаргалка ===== -->
<section id="scr-sheet" class="screen" hidden>
  <div class="bar"><span>Шпаргалка</span><button id="btn-sheet-close" class="icon" type="button" aria-label="Закрыть" style="margin-left:auto">✕</button></div>
  <div id="sheet" style="margin-top:14px"></div>
</section>

</main>
<script>
'use strict';

/* ================= утилиты ================= */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const NB = ' ';
// 48 372 — группы разрядов только для пятизначных и больше
const fmt = n => { const s = String(n); return s.length >= 5 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, NB) : s; };

/* ================= генератор примеров ================= */

// d-значное число без нуля на конце; в 2–3-значных нулей нет вовсе, в 4–5-значных — не больше одного
function num(d) {
  for (;;) {
    const n = rnd(10 ** (d - 1), 10 ** d - 1);
    if (n % 10 === 0) continue;
    const zeros = (String(n).match(/0/g) || []).length;
    if (zeros > (d >= 4 ? 1 : 0)) continue;
    return n;
  }
}
const num2 = () => { for (;;) { const n = num(2); if (n !== 11) return n; } };   // двузначное, не 11
const between = (lo, hi) => { for (;;) { const n = rnd(lo, hi); if (n % 10 !== 0 && n !== 11) return n; } };

// сколько раз при сложении в столбик происходит переход через разряд
function carries(nums) {
  let c = 0, k = 0;
  const max = Math.max(...nums);
  for (let p = 1; p <= max; p *= 10) {
    const s = nums.reduce((t, n) => t + Math.floor(n / p) % 10, 0) + c;
    c = Math.floor(s / 10);
    if (c > 0) k++;
  }
  return k;
}

const mkAdd = (nums, type) => ({
  kind: 'add', type, nums,
  text: nums.map(fmt).join(' + '),
  answer: nums.reduce((a, b) => a + b, 0),
  key: '+' + nums.slice().sort((a, b) => a - b).join(','),
});
const mkMul = (a, b, type) => ({
  kind: 'mul', type, nums: [a, b],
  text: fmt(a) + ' × ' + fmt(b),
  answer: a * b,
  key: '*' + Math.min(a, b) + ',' + Math.max(a, b),
});
const mkSq = (n, type) => ({
  kind: 'mul', type, nums: [n, n],
  text: fmt(n) + '²',
  answer: n * n,
  key: '*' + n + ',' + n,
});

function two(da, db, minCarry) {
  for (;;) {
    const a = num(da), b = num(db);
    if (carries([a, b]) >= minCarry) return mkAdd([a, b], 'add2');
  }
}
const chain = (k, digits) =>
  mkAdd(Array.from({ length: k }, () => num(Array.isArray(digits) ? pick(digits) : digits)), 'addN');

const SQ5 = [15, 25, 35, 45, 55, 65, 75, 85, 95];
const NEAR100 = []; for (let n = 88; n <= 112; n++) if (n % 10 !== 0) NEAR100.push(n);

const GEN = {
  add: {
    1: [() => two(3, 3, 1), () => chain(3, 2)],
    2: [() => two(4, 3, 2), () => chain(3, 3)],
    3: [() => two(4, 4, 2)],
    4: [() => two(5, 4, 2), () => chain(4, 3)],
    5: [() => two(5, 5, 2), () => chain(3, 4), () => chain(4, [3, 4])],
  },
  mul: {
    1: [
      () => mkMul(num2(), rnd(3, 9), 'mulx1'),
      () => mkMul(rnd(11, 19), rnd(11, 19), 'teens'),
      () => mkMul(num2(), 11, 'x11'),
      () => mkMul(num2(), 25, 'x25'),
    ],
    2: [
      () => mkMul(between(12, 49), between(12, 49), 'mul2'),
      () => mkSq(pick(SQ5), 'sq5'),
    ],
    3: [
      () => mkMul(num2(), num2(), 'mul2'),
      () => { const n = num2(); return mkSq(n, n % 10 === 5 ? 'sq5' : 'sq2'); },
    ],
    4: [() => mkMul(num(3), rnd(3, 9), 'mulx1')],
    5: [
      () => mkMul(num(3), num2(), 'mul3x2'),
      () => mkSq(pick(NEAR100), 'sq100'),
    ],
  },
};

function genOne(mode, level) {
  const m = mode === 'mix' ? pick(['add', 'mul']) : mode;
  return pick(GEN[m][level])();
}

// набор из n разных примеров (без повторов внутри тренировки)
function makeSet(mode, level, n) {
  const out = [], seen = new Set();
  for (let guard = 0; out.length < n && guard < 20000; guard++) {
    const p = genOne(mode, level);
    if (seen.has(p.key)) continue;
    seen.add(p.key);
    out.push(p);
  }
  return out;
}

// проверка ответа: null — ввод не число (не засчитываем), иначе true/false
function checkAnswer(p, raw) {
  const s = String(raw).replace(/[\s  ]/g, '');
  if (!/^\d+$/.test(s)) return null;
  return Number(s) === p.answer;
}

/* ================= приёмы ================= */
const places = n => { // 3659 → [3000, 600, 50, 9]
  const s = String(n), out = [];
  for (let i = 0; i < s.length; i++) if (s[i] !== '0') out.push(Number(s[i]) * 10 ** (s.length - 1 - i));
  return out;
};
const ceilTo = (x, s) => Math.ceil(x / s) * s;

function roundingFor(b) {
  for (const [s, lim] of [[1000, 30], [100, 12], [10, 2]]) {
    if (s >= b || (s === 10 && b >= 1000)) continue; // до десятков округляем только небольшие числа
    const R = ceilTo(b, s), d = R - b;
    if (d > 0 && d <= lim) return { R, d };
  }
  return null;
}

function hint(p) {
  const [a, b] = p.nums;
  switch (p.type) {
    case 'add2': {
      let x = a, y = b, r = roundingFor(b);
      if (!r) { const ra = roundingFor(a); if (ra) { x = b; y = a; r = ra; } }
      if (r) return `<b>Округли и поправь.</b> ${fmt(y)} = ${fmt(r.R)} − ${r.d}, поэтому ${fmt(x)} + ${fmt(y)} = ${fmt(x)} + ${fmt(r.R)} − ${r.d}.`;
      return `<b>По разрядам, слева направо.</b> К ${fmt(a)} прибавляй части второго числа по очереди: ${places(b).map(fmt).join(' + ')}. Держи в голове только промежуточную сумму.`;
    }
    case 'addN': {
      let s;
      const len = new Set(p.nums.map(n => String(n).length));
      if (len.size === 1) {
        const P = 10 ** (String(a).length - 1);
        const heads = p.nums.map(n => Math.floor(n / P) * P), tails = p.nums.map(n => n % P);
        s = `<b>Сначала старшие разряды, потом остальное.</b> ${heads.map(fmt).join(' + ')}, затем ${tails.join(' + ')}, и сложи две суммы.`;
      } else {
        s = `<b>По одному числу.</b> Складывай слева направо, каждый раз прибавляя следующее число по разрядам.`;
      }
      for (let i = 0; i < p.nums.length; i++) for (let j = i + 1; j < p.nums.length; j++)
        if ((p.nums[i] + p.nums[j]) % 10 === 0)
          return s + ` Заметь: у ${fmt(p.nums[i])} и ${fmt(p.nums[j])} единицы дают 10 — эту пару удобно сложить первой.`;
      return s;
    }
    case 'mulx1': {
      const u = a % 10;
      if (u >= 8) {
        const d = 10 - u, R = a + d;
        return `<b>Округли и поправь.</b> ${a} = ${R} − ${d}, поэтому ${a} × ${b} = ${R} × ${b} − ${d} × ${b}.`;
      }
      return `<b>Разложи по разрядам.</b> ${a} × ${b} = ${places(a).map(x => x + ' × ' + b).join(' + ')}.`;
    }
    case 'teens':
      return `<b>Числа от 11 до 19.</b> К первому числу прибавь единицы второго, умножь на 10 и прибавь произведение единиц: ${a} × ${b} = (${a} + ${b % 10}) × 10 + ${a % 10} × ${b % 10}.`;
    case 'x11': {
      const t = Math.floor(a / 10), u = a % 10;
      return `<b>Умножение на 11.</b> Раздвинь цифры и впиши между ними их сумму: ${a} × 11 → ${t} [${t} + ${u}] ${u}. Если сумма больше 9 — единицу перенеси в старший разряд.`;
    }
    case 'x25':
      return `<b>×25 = ×100 : 4.</b> ${a} × 25 = ${a}00 : 4. ` + (a % 4 === 0
        ? `${a} делится на 4 нацело — раздели и допиши два нуля.`
        : `Раздели ${a} на 4 с остатком: частное — это сотни, а каждая единица остатка даёт ещё 25.`);
    case 'mul2':
    case 'mul3x2': {
      const m = (a + b) / 2, d = Math.abs(a - b) / 2;
      if (p.type === 'mul2' && d > 0 && Number.isInteger(m) && m % 10 === 0)
        return `<b>Разность квадратов.</b> Числа симметричны относительно ${m}: ${a} × ${b} = (${m} − ${d})(${m} + ${d}) = ${m}² − ${d}².`;
      const x = b % 10 >= 8 ? b : (p.type === 'mul2' && a % 10 >= 8 ? a : null);
      if (x !== null) {
        const y = x === b ? a : b, dd = 10 - x % 10;
        return `<b>Округли и поправь.</b> ${x} = ${x + dd} − ${dd}, поэтому ${y} × ${x} = ${y} × ${x + dd} − ${y} × ${dd}.`;
      }
      const t = b - b % 10;
      return `<b>Разложи второй множитель.</b> ${a} × ${b} = ${a} × ${t} + ${a} × ${b % 10}. Сначала умножь на десятки, потом прибавь единицы.`;
    }
    case 'sq5': {
      const t = Math.floor(a / 10);
      return `<b>Квадрат числа на 5.</b> Число десятков умножь на следующее за ним число и допиши 25: ${a}² → ${t} × ${t + 1}, затем «25».`;
    }
    case 'sq2': {
      const u = a % 10, t = a - u, d = u <= 5 ? u : u - 10; // a − d — ближайшее круглое
      const lo = a - Math.abs(d), hi = a + Math.abs(d);
      return `<b>Через круглое число.</b> n² = (n − d)(n + d) + d²: ${a}² = ${lo} × ${hi} + ${Math.abs(d)}². ` +
        `Или по формуле (a + b)² = a² + 2ab + b²: ${a}² = ${t}² + 2 × ${t} × ${u} + ${u}².`;
    }
    case 'sq100': {
      const d = a - 100, sg = d < 0 ? '−' : '+', ad = Math.abs(d);
      // пример берём на другом числе, чтобы не выдать ответ
      const lo = a === 97 ? 96 : 97, hi = a === 104 ? 103 : 104;
      const ex = n => { const e = n - 100, s = e < 0 ? '−' : '+', ae = Math.abs(e);
        return `${n}² → ${n} ${s} ${ae} = ${n + e} и ${ae}² = ${String(ae * ae).padStart(2, '0')} → ${n * n}`; };
      return `<b>Квадрат около 100.</b> Пример: ${ex(lo)}; ${ex(hi)}. ` +
        `Здесь ${a} = 100 ${sg} ${ad}: первая часть ${a} ${sg} ${ad}, последние две цифры — ${ad}²` +
        (ad * ad > 99 ? ` (это больше 99, перенеси сотни в первую часть).` : '.');
    }
  }
  return '';
}

// 4 варианта ответа: правильный + отвлекающие (свои, затем из той же темы, исключая эквивалентные)
function makeOptions(it) {
  const opts = [it.a];
  for (const x of shuffle((it.d || []).slice())) { if (opts.length >= 4) break; if (!opts.includes(x)) opts.push(x); }
  if (opts.length < 4) {
    const pool = shuffle(BANK.filter(o => o !== it && o.c === it.c && (o.p || '') === (it.p || '') && !(it.g && o.g === it.g)).map(o => o.a));
    for (const x of pool) { if (opts.length >= 4) break; if (!opts.includes(x)) opts.push(x); }
  }
  return shuffle(opts);
}

// темы чередуются случайно, чтобы большая тема не вытесняла маленькие
function makeFormulaSet(cats, n) {
  const q = {};
  for (const c of cats) q[c] = shuffle(BANK.filter(it => it.c === c));
  const out = [];
  while (out.length < n) {
    const avail = cats.filter(c => q[c] && q[c].length);
    if (!avail.length) break;
    out.push({ kind: 'f', item: q[pick(avail)].pop() });
  }
  return out;
}

const KEY_HIST = 'ustny.history.v1', KEY_SET = 'ustny.settings.v1';
const store = {
  ok: (() => { try { const k = '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; } })(),
  mem: {},
  get(k, def) {
    try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); }
    catch (e) { return k in this.mem ? this.mem[k] : def; }
  },
  set(k, v) {
    this.mem[k] = v;
    try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; }
  },
};

function init() {

  if (!(cfg.level >= 1 && cfg.level <= 5)) cfg.level = 1;
  if (cfg.n !== 10 && cfg.n !== 20) cfg.n = 10;

  if (!cfg.cats.length) cfg.cats = CATS.map(c => c.id);

  /* --- стартовый экран --- */
  $('cats').innerHTML = CATS.map(c => `<button type="button" data-v="${c.id}">${c.name}</button>`).join('');

  function renderStart() {
    const press = (seg, v) => { for (const b of $(seg).children) b.setAttribute('aria-pressed', String(b.dataset.v === String(v))); };
    press('seg-mode', cfg.mode); press('seg-level', cfg.level); press('seg-n', cfg.n);

      ? 'вперемешку: ' + LEVEL_DESC.add[cfg.level] + '; ' + LEVEL_DESC.mul[cfg.level]
      : (LEVEL_DESC[cfg.mode] || [])[cfg.level] || '';
    renderBest(); renderHist();
    $('store-note').hidden = store.ok;
  }

  function better(a, b) { // лучше — больший процент, при равенстве — быстрее
    if (!b) return true;
    const pa = a.c / a.n, pb = b.c / b.n;
    return pa !== pb ? pa > pb : a.t / a.n < b.t / b.n;
  }
  function renderBest() {
    const h = history().filter(r => !r.r);
    if (!h.length) { $('best').innerHTML = '<div class="empty">Пока нет завершённых тренировок.</div>'; return; }
    const best = {};
    for (const r of h) { const k = r.m === 'f' ? 'f' : r.m + r.l; if (better(r, best[k])) best[k] = r; }
    let html = '<table class="best"><tr><th></th>' + [1, 2, 3, 4, 5].map(l => `<th>ур. ${l}</th>`).join('') + '</tr>';
    for (const m of ['add', 'mul', 'mix']) {
      html += `<tr><td>${MODES[m]}</td>` + [1, 2, 3, 4, 5].map(l => {
        const r = best[m + l];
        return r ? `<td>${Math.round(100 * r.c / r.n)}%<small>${fmtSec(r.t / r.n)}</small></td>` : '<td class="muted">—</td>';
      }).join('') + '</tr>';
    }
    html += '</table>';
    const f = best.f;
    html += `<div class="fbest"><b>Формулы:</b> ` + (f ? `${f.c}/${f.n} (${Math.round(100 * f.c / f.n)}%), ${fmtSec(f.t / f.n)} на вопрос <span class="muted">· ${f.l}</span>` : '<span class="muted">—</span>') + '</div>';

    const p = S.list[S.i];
    $('q-count').textContent = `${S.i + 1} / ${S.list.length}`;
    $('q-prog').style.width = (100 * S.i / S.list.length) + '%';
    const qt = $('q-text');
    qt.className = 'problem';
    $('q-fb').textContent = ''; $('q-fb').className = 'fb';
    $('q-hint').hidden = true;
    if (p.kind === 'f') {
      qt.classList.add('f');
      qt.innerHTML = p.item.q + ' =';
      $('q-form').hidden = true;
      $('q-input').blur();
      p.opts = makeOptions(p.item);
      const box = $('q-opts');
      box.hidden = false;
      box.innerHTML = p.opts.map((o, i) => `<button type="button" data-i="${i}"><span class="k">${i + 1}</span><span>${o}</span></button>`).join('');
    } else {
      const len = p.text.length + 2;
      if (len > 18) qt.classList.add('sm'); else if (len > 12) qt.classList.add('md');
      qt.textContent = p.text + ' =';
      $('q-opts').hidden = true;
      $('q-form').hidden = false;
      const inp = $('q-input');
      inp.value = ''; inp.readOnly = false; inp.className = '';
      inp.focus();
    }
    S.lock = false;
    S.qStart = performance.now();
    tick();
  }

  function finishAnswer(ok, p, given) {
    S.lock = true;
    S.elapsed += performance.now() - S.qStart;
    if (ok) S.correct++; else S.mistakes.push({ p, given });
    $('q-text').classList.add(ok ? 'ok' : 'bad');
    const fb = $('q-fb');
    fb.className = 'fb ' + (ok ? 'ok' : 'bad');
    tick();
    const delay = ok ? 1000 : (p.kind === 'f' ? 2000 : 1000);
    return { fb, delay };
  }
  function goNext(delay) {
    nextId = setTimeout(() => {
      S.i++;
      if (S.i >= S.list.length) finish(); else showQ();
    }, delay);
  }

  $('q-form').addEventListener('submit', e => {
    e.preventDefault();
    if (!S || S.lock) return;
    const p = S.list[S.i], inp = $('q-input');
    const res = checkAnswer(p, inp.value);
    if (res === null) { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.focus(); return; }
    const { fb, delay } = finishAnswer(res, p, inp.value.trim());
    inp.readOnly = true;
    inp.className = res ? 'ok' : 'bad';
    fb.textContent = res ? 'Верно' : 'Неверно. Правильно: ' + fmt(p.answer);
    inp.focus();
    goNext(delay);
  });

  function chooseOpt(i) {
    if (!S || S.lock) return;
    const p = S.list[S.i];
    if (p.kind !== 'f' || !p.opts[i]) return;
    const ok = p.opts[i] === p.item.a;
    const { fb, delay } = finishAnswer(ok, p, p.opts[i]);
    const btns = $('q-opts').children;
    btns[i].classList.add(ok ? 'ok' : 'bad');
    if (!ok) btns[p.opts.indexOf(p.item.a)].classList.add('ok');
    fb.textContent = ok ? 'Верно' : 'Неверно — правильный вариант подсвечен';
    goNext(delay);
  }
  $('q-opts').addEventListener('click', e => { const b = e.target.closest('button'); if (b) chooseOpt(Number(b.dataset.i)); });

  document.addEventListener('keydown', e => {
    if ($('scr-quiz').hidden || !S) return;
    const p = S.list[S.i];
    if (p && p.kind === 'f' && e.key >= '1' && e.key <= '4') { chooseOpt(Number(e.key) - 1); e.preventDefault(); }
    if (e.key === 'Escape') $('q-hint').hidden = true;
  });

  $('btn-hint').addEventListener('click', () => {
    const box = $('q-hint');
    if (!box.hidden) { box.hidden = true; return; }
    const p = S.list[S.i];
    box.innerHTML = p.kind === 'f' ? (p.item.h || CAT[p.item.c].h) : hint(p);
    box.hidden = false;
    if (p.kind !== 'f') $('q-input').focus();
  });

  $('btn-exit').addEventListener('click', () => {
    if (S && S.i > 0 && !confirm('Прервать тренировку? Результат не сохранится.')) return;
    clearTimeout(nextId); clearInterval(tickId); S = null;
    renderStart(); show('scr-start');
  });

  /* --- итог --- */
  function finish() {
    clearInterval(tickId);
    const n = S.list.length;
    const rec = { d: Date.now(), m: S.mode, l: S.mode === 'f' ? catsLabel(S.cats) : S.level, c: S.correct, n, t: Math.round(S.elapsed), r: !!S.retry };
    const h = history(); h.push(rec); store.set(KEY_HIST, h.slice(-300));

    $('r-score').textContent = `${S.correct}/${n}`;
    $('r-sub').textContent = MODES[S.mode] + (S.mode === 'f' ? ' · ' + rec.l : ' · уровень ' + S.level) + (S.retry ? ' · работа над ошибками' : '');
    $('r-time').textContent = fmtTime(S.elapsed);
    $('r-avg').textContent = fmtSec(S.elapsed / n);
    $('r-err-card').hidden = !S.mistakes.length;
    $('r-err').innerHTML = S.mistakes.map(({ p, given }) => p.kind === 'f'
      ? `<li>${p.item.q} = <b>${p.item.a}</b><div class="yours">ваш ответ: ${given}</div></li>`
      : `<li>${p.text} = <b>${fmt(p.answer)}</b> <span class="yours">(ваш ответ: ${given.replace(/[<>&]/g, '')})</span></li>`).join('');
    $('btn-errs').disabled = !S.mistakes.length;
    show('scr-result');
  }
  $('btn-again').addEventListener('click', () => { const retry = S && S.retry; start(retry ? shuffle(S.list.slice()) : newList(), retry); });
  $('btn-errs').addEventListener('click', () => { if (S && S.mistakes.length) start(shuffle(S.mistakes.map(m => m.p)), true); });
  $('btn-menu').addEventListener('click', () => { S = null; renderStart(); show('scr-start'); });

  $('btn-go').addEventListener('click', () => start(newList(), false));

  /* --- шпаргалка --- */
  $('btn-sheet').addEventListener('click', () => {
    let html = '';
    for (const c of cfg.cats) {
      html += `<div class="card"><h2>${CAT[c].name}</h2>`;
      if (c === 'trv') {
        const deg = TRIG_ANGLES.sin;
        html += '<table class="trig"><tr><th>угол</th><th>sin</th><th>cos</th><th>tg</th><th>ctg</th></tr>' + deg.map(d =>
          `<tr><td>${d}°${d ? ` <span class="rad">${RAD[d]}</span>` : ''}</td>` + ['sin', 'cos', 'tg', 'ctg'].map(fn => {
            const v = TRIG[fn](d), s = canonVal(v);
            return `<td>${s === NOVAL ? '—' : s}</td>`;
          }).join('') + '</tr>').join('') + '</table>';
        html += '<div class="sheet-sub">Обратные функции</div>';
        html += BANK.filter(it => it.c === 'trv' && it.p === 'ang').map(it => `<div class="sheet-row">${it.q} = ${it.a}</div>`).join('');
      } else {
        html += BANK.filter(it => it.c === c).map(it => `<div class="sheet-row">${it.q} = ${it.a}</div>`).join('');
      }
      html += `<p class="muted" style="margin:10px 0 0;font-size:.9rem">${CAT[c].h}</p></div>`;
    }
    $('sheet').innerHTML = html;
    show('scr-sheet');
  });
  $('btn-sheet-close').addEventListener('click', () => show('scr-start'));

  renderStart();
}

if (typeof document !== 'undefined') init();
</script>
</body>
</html>
